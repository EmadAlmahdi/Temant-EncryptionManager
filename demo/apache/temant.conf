# Apache vhost for local Temant package development, covering everything under
# /var/www/temant (all Temant-* repos, not just this one).
#
# PHP is handled by the server-wide php8.5-fpm proxy_fcgi config already present in
# /etc/apache2/conf-enabled/php8.5-fpm.conf, so no PHP handler directives are needed here.
#
# Install with (see demo/README.md for the full walkthrough):
#   sudo cp demo/apache/temant.conf /etc/apache2/sites-available/temant.conf
#   sudo a2ensite temant.conf
#   sudo systemctl reload apache2
#   echo "127.0.0.1 temant.local" | sudo tee -a /etc/hosts

<VirtualHost *:80>
    ServerName temant.local
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/temant

    # Browsable index of every Temant-* repo at http://temant.local/
    <Directory /var/www/temant>
        Options +Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # --- temant/encryption-manager demo ------------------------------------------------
    # React frontend (built via `npm run build` in demo/web) served at /encryption-manager/,
    # with its PHP API aliased alongside it at /encryption-manager/api/ so the frontend's
    # relative fetches (see demo/web/src/lib/api.ts) resolve without any CORS setup.
    # Rebuild after frontend changes: cd Temant-EncryptionManager/demo/web && npm run build

    Alias /encryption-manager/api /var/www/temant/Temant-EncryptionManager/demo/api
    <Directory /var/www/temant/Temant-EncryptionManager/demo/api>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    Alias /encryption-manager /var/www/temant/Temant-EncryptionManager/demo/web/dist
    <Directory /var/www/temant/Temant-EncryptionManager/demo/web/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Future packages: add their own Alias pair here, following the same
    # /<package>/api + /<package> shape, then register them in
    # Temant-EncryptionManager/demo/web/src/packages/registry.tsx.

    ErrorLog ${APACHE_LOG_DIR}/temant-error.log
    CustomLog ${APACHE_LOG_DIR}/temant-access.log combined
</VirtualHost>
