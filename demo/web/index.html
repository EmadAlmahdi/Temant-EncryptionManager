<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Temant &mdash; Package Demos</title>
    <script>
      // Applied before paint so there's no flash of the wrong theme on load.
      (function () {
        var stored = localStorage.getItem("temant-theme");
        var wantsDark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (wantsDark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
